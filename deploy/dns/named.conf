options {
    directory "/var/cache/bind";
    pid-file "/run/named/named.pid";
    session-keyfile "/run/named/session.key";
    listen-on port 53 { any; };
    listen-on-v6 { none; };
    recursion no;
    allow-recursion { none; };
    allow-query-cache { none; };
    allow-query { any; };
    allow-transfer { none; };
    dnssec-validation no;
    minimal-responses yes;
    version none;
    hostname none;
    server-id none;
    max-udp-size 1232;
    rate-limit { responses-per-second 10; window 5; slip 2; };
};
controls {};
zone "tradersho.com" {
    type primary;
    file "/etc/bind/zones/tradersho.com.db";
    allow-update { none; };
    allow-transfer { none; };
    notify no;
};

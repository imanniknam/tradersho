ServerName tradersho.com
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
<FilesMatch "(?i)(^wp-config\.php$|^\.env|\.(sql|sql\.gz|tar|tar\.gz|bak|log)$)">
    Require all denied
</FilesMatch>
<Directory /var/www/html>
    Options -Indexes
</Directory>
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 2
    MaxSpareServers 4
    MaxRequestWorkers 8
    MaxConnectionsPerChild 500
</IfModule>

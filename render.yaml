services:
  - type: web
    name: tradersho-panel-demo
    runtime: docker
    plan: free
    dockerfilePath: ./app/Dockerfile
    dockerContext: ./app
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tradersho-demo-db
          property: connectionString

databases:
  - name: tradersho-demo-db
    plan: free
    databaseName: tradersho_demo
    ipAllowList: []

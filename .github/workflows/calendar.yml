name: Update economic calendar
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Test and deploy VPS']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: calendar-ingest
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect PersianFX and update shared cache
        env:
          CALENDAR_PANEL_URL: https://my.tradersho.com
          CALENDAR_INGEST_TOKEN: ${{ secrets.CALENDAR_INGEST_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          CRON_EXPRESSION: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            python3 app/scripts/collect-persianfx.py --past-days 30 --future-days 30
          elif [ "$EVENT_NAME" != schedule ] || [ "$CRON_EXPRESSION" = '17 * * * *' ]; then
            python3 app/scripts/collect-persianfx.py
          else
            python3 app/scripts/collect-persianfx.py --past-days 0 --future-days 0
          fi

name: Update official economic calendar
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Test and deploy VPS']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: calendar-ingest
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect official free schedules and update shared cache
        env:
          CALENDAR_PANEL_URL: https://my.tradersho.com
          CALENDAR_INGEST_TOKEN: ${{ secrets.CALENDAR_INGEST_TOKEN }}
        run: python3 app/scripts/collect-calendar.py

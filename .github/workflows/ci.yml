name: Validate app
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build

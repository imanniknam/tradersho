name: Test and deploy VPS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tradersho-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: qa-ci-only
          POSTGRES_DB: tradersho_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qa -d tradersho_qa"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://qa:qa-ci-only@127.0.0.1:5432/tradersho_qa
      PORT: '5183'
      HOST: 127.0.0.1
      NODE_ENV: production
      CALENDAR_INGEST_TOKEN: qa-only-calendar-ingest-secret-not-production
      CAPTCHA_MODE: internal
      CAPTCHA_SECRET: qa-only-captcha-secret-for-isolated-ci
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --include=dev
      - run: npm run test:unit
      - run: python3 -m unittest discover -s scripts -p "test_calendar.py"
      - run: npm run build
      - name: Database and API integration
        run: |
          node server/index.mjs > /tmp/tradersho-ci-server.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5183/api/health; then break; fi
            sleep 1
          done
          node scripts/ci-smoke.mjs
          node scripts/ci-calendar.mjs
          node scripts/ci-mail.mjs
      - name: Desktop and mobile browser checks
        run: CHROME_BIN="$(command -v google-chrome)" node scripts/ci-ui.mjs
      - name: Application diagnostics on failure
        if: failure()
        run: cat /tmp/tradersho-ci-server.log || true
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable release image
        run: docker build --build-arg APP_VERSION="$GITHUB_SHA" -t "tradersho:$GITHUB_SHA" app
      - name: Package release
        run: |
          mkdir -p /tmp/tradersho-release
          docker pull postgres:17-alpine
          docker pull caddy:2-alpine
          docker save "tradersho:$GITHUB_SHA" postgres:17-alpine caddy:2-alpine | gzip -1 > /tmp/tradersho-release/image.tar.gz
          cp deploy/vps/{compose.yaml,Caddyfile,deploy.sh,backup.sh} /tmp/tradersho-release/
          tar -C /tmp/tradersho-release -cf /tmp/tradersho-bundle.tar image.tar.gz compose.yaml Caddyfile deploy.sh backup.sh
      - name: Deploy over authenticated SSH
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
        run: |
          test -n "$VPS_KEY" && test -n "$VPS_KNOWN_HOSTS" && test -n "$VPS_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" > ~/.ssh/tradersho-ci
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/tradersho-ci ~/.ssh/known_hosts
          ssh -i ~/.ssh/tradersho-ci -p "${VPS_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 "root@$VPS_HOST" "deploy $GITHUB_SHA" < /tmp/tradersho-bundle.tar
      - name: Public health verification
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors http://109.122.254.172/api/health > /tmp/health.json
          python3 -c 'import json,os; h=json.load(open("/tmp/health.json")); assert h["ok"] and h["version"]==os.environ["GITHUB_SHA"]'
      - name: Remove temporary deployment identity
        if: always()
        run: rm -f ~/.ssh/tradersho-ci

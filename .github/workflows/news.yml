name: Refresh market news
on:
  schedule:
    - cron: '23 * * * *'
  workflow_run:
    workflows: ['Test and deploy VPS']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tradersho-market-news
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Refresh public headlines and Persian titles
        env:
          NEWS_PANEL_URL: https://my.tradersho.com
          NEWS_INGEST_TOKEN: ${{ secrets.NEWS_INGEST_TOKEN }}
        run: python3 app/scripts/collect-news.py

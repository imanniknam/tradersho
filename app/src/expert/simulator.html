.expert{background:var(--panel);border:1px solid #45627c;border-radius:5px;box-shadow:0 12px 35px #0006;color:var(--panel-ink);font:12px "Segoe UI",Arial,sans-serif;direction:ltr;overflow:hidden}
.expert-top{height:36px;background:#091d30;border-bottom:1px solid var(--panel-line);display:flex;align-items:center;padding:0 11px;gap:9px}
.expert-title{font-weight:600;font-size:12px;flex:1;white-space:nowrap}
.expert-top .version{color:#819ab1;font-size:10px;margin-left:4px;font-weight:400}
.expert-tools{display:flex;gap:8px;color:#778da6;margin-left:5px}
.expert-tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;padding:10px 11px 9px}
.expert-tabs button,.ebtn{font:12px "Segoe UI",Arial,sans-serif;border:1px solid var(--panel-line);background:#0b2438;color:var(--panel-ink);border-radius:2px;min-height:29px;padding:4px 7px;line-height:1.25;white-space:nowrap}
.expert-tabs button{min-height:32px;padding:4px 2px}
.expert-tabs button[aria-selected=true],.ebtn.on{background:#603bff;border-color:#a58bff;color:#fff}
.expert-tabs button:hover,.ebtn:hover{border-color:#8b78dd}
.expert-body{padding:1px 11px 6px;min-height:423px;max-height:557px;overflow:auto;scrollbar-width:thin;scrollbar-color:#45627c transparent}
.expert-footer{height:30px;display:flex;align-items:center;justify-content:center;color:#7c93aa;font:9px "Segoe UI",Arial,sans-serif;letter-spacing:1px;border-top:1px solid #1e394e;margin:0 11px}
.erow{display:grid;grid-template-columns:1.12fr 1fr .84fr;align-items:center;gap:7px;min-height:35px;padding:3px 0;position:relative;border-radius:3px}
.erow.two{grid-template-columns:1fr 1.24fr}
.erow.equal{grid-template-columns:repeat(2,minmax(0,1fr))}
.erow.four{grid-template-columns:1fr repeat(3,.76fr)}
.erow .label{color:var(--panel-ink);font-size:12px;padding-left:3px;line-height:1.3}
.erow .muted{color:var(--panel-muted)}
.efield{min-height:29px;width:100%;border:1px solid var(--panel-line);border-radius:2px;background:var(--field);color:var(--panel-ink);text-align:center;outline:none;font:12px "Segoe UI",Arial,sans-serif;padding:5px 3px;font-variant-numeric:tabular-nums}
.efield:focus{border-color:#ab8fff;background:#18304d;box-shadow:0 0 0 1px #ab8fff}
.efield[aria-invalid=true]{border-color:#fb8c9d}
.efield[readonly]{background:#0b2134;color:#bdcddd;cursor:pointer}
.efield::-webkit-inner-spin-button{opacity:.45}
.efield[readonly]:focus{background:#0b2134}
.input-pair{display:grid;grid-template-columns:minmax(0,1fr) 29px;gap:3px}
.input-pair .steppers{display:flex;flex-direction:column;gap:2px}
.steppers button{border:1px solid var(--panel-line);background:#0b2438;color:#c5d4e3;font-size:11px;line-height:10px;min-height:13px;border-radius:2px;padding:0}
.unit{font-size:10px;color:#a2b5c8;text-align:center}
.row-controls{display:flex;gap:4px;align-items:center;min-width:0}
.row-controls>*{min-width:0}
.row-controls .efield{flex:1}
.row-controls .ebtn{flex:1}
.row-controls .tiny{flex:0 0 25px;min-width:25px;padding:2px}
.eheading{font-size:10px;letter-spacing:.4px;color:var(--panel-muted);display:flex;align-items:center;gap:8px;margin:12px 3px 4px;line-height:1.5}
.eheading:after{content:"";height:1px;background:#294051;flex:1}
.separator{height:1px;background:#385065;margin:10px 0}
.risk-header{padding:2px 0 1px;text-align:center;color:#a8b7cb;font-size:10px;min-height:26px}
.segmented{display:flex;gap:3px;align-items:center}
.segmented .ebtn{flex:1;min-height:25px;padding:2px 4px;font-size:10px}
.ebtn.buy{background:#195e4b;border-color:#3b8c73;color:#c9f6e8}
.ebtn.sell{background:#733749;border-color:#9d5268;color:#ffdde5}
.ebtn.success{color:var(--positive)}
.ebtn.danger{border-color:#7e3b51;color:#f7b3c4;background:#462438}
.ebtn.main-action{background:#603bff;color:#fff;border-color:#9e81ff;min-height:32px;font-weight:600;letter-spacing:.3px}
.ebtn.wide{width:100%;margin:4px 0}
.ebtn .arrow{float:right;color:#a9bcce}
.green{color:var(--positive)!important}
.red{color:var(--negative)!important}
.selected-help{outline:1.5px solid #b696ff;outline-offset:3px;background:#5d42aa22!important;box-shadow:0 0 0 5px #a486ff0a;z-index:1}
.expert [data-help]{cursor:pointer}

.panel-error{font:10px DemoPersian,Tahoma,sans-serif;direction:rtl;color:#ffbdc9;padding:4px 2px;line-height:1.9;min-height:0}
.panel-error:empty{display:none}
.micro-caption{font-size:10px;color:var(--panel-muted);line-height:1.6;padding:5px 3px}
.subnav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:8px 0}
.subnav .ebtn{font-size:10px;min-height:28px}
.trailnav{grid-template-columns:repeat(6,minmax(0,1fr))}
.trailnav .ebtn{padding:3px 0;font-size:10px}
.portfolio-table{width:100%;border-collapse:separate;border-spacing:3px;font-size:10px;table-layout:fixed;margin:7px 0}
.portfolio-table th{color:#89a2b8;font-weight:400;font-size:9px;padding:4px 0;text-align:center}
.portfolio-table td{background:#0b2438;border:1px solid #294b63;border-radius:2px;padding:6px 3px;text-align:center;color:#d3dfeb}
.portfolio-table td:first-child{background:transparent;border-color:transparent;font-size:10px}
.portfolio-table .tick{color:#9d87ff;font-size:12px;cursor:pointer}
.performance{font-size:11px;padding:9px 8px;display:flex;justify-content:space-between;background:#0a2236;border:1px solid #294b63;margin:7px 0;border-radius:2px}
.arm-actions{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:9px 0 4px}
.check{width:14px;height:14px;accent-color:#7854ff;cursor:pointer}
.inline-check{display:flex;align-items:center;gap:7px;font-size:11px;color:#b5c7d7;padding:8px 3px}
.manage-buttons .ebtn{min-height:31px}
.more-layout{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;margin:7px 0}
.more-nav{display:flex;flex-direction:column;gap:5px;padding-right:8px;border-right:1px solid #294357}
.more-nav .ebtn{font-size:10px;text-align:left;min-height:33px}
.more-content{min-width:0}
.more-content .erow.two{grid-template-columns:1fr 1fr;gap:5px}
.more-content .erow .label{font-size:10px}
.more-content .efield{font-size:11px}

 account:['مبنای محاسبهٔ ریسک','در حالت درصدی، مبلغ ریسک از مقدار حساب محاسبه می‌شود. انتخاب Balance یا Equity مبنای این محاسبه را تغییر می‌دهد.',['با دکمهٔ Balance / Equity مبنا را انتخاب کنید.','برای آزمودن یک حساب فرضی، عدد این کادر را تغییر دهید.','تغییر مبلغ ریسک و حجم را در خروجی ببینید.'],'در اکسپرت، اطلاعات حساب از متاتریدر خوانده می‌شود؛ اینجا موجودی و اکوییتی فرضی‌اند.','account'],

 result:['ورودی و نتیجهٔ محاسبه','Input مقدار انتخابی شما و Result نتیجهٔ محاسبه پس از گردشدن حجم است. همین تفاوت به شما نشان می‌دهد ریسک نهایی دقیقاً چقدر شده است.',['درصد یا مبلغ ریسک را وارد کنید.','ستون Result را با مقدار ورودی مقایسه کنید.','ریسک نهایی و سود احتمالی را کنار هم بررسی کنید.'],'اعداد سود و ریسک، برآورد سناریو هستند؛ در اجرای واقعی، قیمت اجرا و هزینه‌های بروکر نیز اثر دارند.','risk'],

 be:['سر‌به‌سر کردن معامله','BREAK EVEN ابزار جابه‌جایی استاپ به سطح سر‌به‌سر معامله است. Auto BE at مشخص می‌کند از چه میزان پیشروی برحسب R فعال شود.',['معاملهٔ هدف را انتخاب کنید.','مقدار AUTO BE AT را برحسب R تعیین کنید.','ARM SELECTED را برای آماده‌سازی یا اجرای دستی نمونه را امتحان کنید.'],'در اکسپرت، هزینه‌های معامله نیز در محاسبهٔ سطح سر‌به‌سر در نظر گرفته می‌شوند.','be'],

const detailedGuideData={"entry_direction":["جهت معامله · BUY / SELL","این دکمه جهت سناریوی معامله را بین خرید و فروش عوض می‌کند. جهت انتخابی، جای درست استاپ و تارگت نسبت به قیمت ورود و متن دکمهٔ ثبت سفارش را مشخص می‌کند.",["برای خرید، BUY / LONG را انتخاب کنید.","برای فروش، دوباره دکمه را بزنید تا SELL / SHORT شود.","در خرید، استاپ زیر ورود و هدف بالای ورود قرار می‌گیرد؛ در فروش برعکس است."],"در نمونه، با تغییر جهت، فاصله‌های فعلی استاپ و هدف حفظ می‌شوند.","detail"],"entry_price":["قیمت ورود · Entry","این کادر قیمت مبنای ورود به معامله است. فاصلهٔ همین قیمت تا استاپ برای محاسبهٔ ریسک و حجم و فاصلهٔ آن تا هدف برای محاسبهٔ سود استفاده می‌شود.",["قیمت ورود را مستقیماً در کادر بنویسید.","برای تغییر کوچک‌تر از دکمه‌های + و − کنار کادر استفاده کنید.","پس از تغییر، حجم کنار TP و ریسک نهایی را بررسی کنید."],"در حالت Instant قیمت اجرای واقعی در متاتریدر به قیمت جاری و اجرای بروکر وابسته است؛ اینجا قیمت فرضی است.","detail"],"stop_value":["مقدار حد ضرر · Stop-loss","این کادر محل یا فاصلهٔ حد ضرر را تعیین می‌کند. واحد کنار عنوان مشخص می‌کند عدد واردشده قیمت است یا فاصله برحسب پوینت.",["در واحد PX، قیمت استاپ را بنویسید.","در واحد PT، فاصلهٔ استاپ از ورود را وارد کنید.","با ریسک ثابت، استاپ دورتر باعث کاهش حجم محاسبه‌شده می‌شود."],"واحد پوینت در این نمونه ۰٫۰۰۱ دلار است؛ اندازهٔ پوینت واقعی به نماد بروکر وابسته است.","detail"],"stop_unit":["واحد استاپ · PX / PT","این دکمه روش واردکردن استاپ را عوض می‌کند. PX یعنی قیمت مستقیم؛ PT یعنی تعداد پوینت فاصله از ورود.",["روی واحد کنار Stop-loss کلیک کنید.","عدد کادر استاپ با همان فاصله به واحد جدید نمایش داده می‌شود.","برای برگشت به واردکردن قیمت، دوباره PX را انتخاب کنید."],"تغییر واحد به‌تنهایی نباید فاصلهٔ استاپ یا مبلغ ریسک سناریو را عوض کند.","detail"],"target_price":["قیمت هدف · Take-profit","این کادر محل هدف اول معامله است. در خرید، هدف بالای ورود و در فروش پایین ورود قرار می‌گیرد. نسبت آن به فاصلهٔ استاپ در کادر R کنار TP دیده می‌شود.",["قیمت یا فاصلهٔ هدف را با توجه به واحد PX / PT وارد کنید.","نسبت هدف و سود محاسبه‌شده را مرو ,"ضریب کنار آن، فاصلهٔ نهایی استاپ را تعیین می‌کند."],"در این محیط، دورهٔ ۱ تا ۲۰۰ روی ATR کندل‌های ساختگی اثر دارد؛ استاپ هنگام فعال‌بودن ATR خودکار به‌روز می‌شود.","detail"],"atr_factor":["ضریب ATR در Setup","ضریب، فاصلهٔ استاپ را از ATR به دست می‌آورد: فاصلهٔ استاپ برابر مقدار ATR ضربدر این عدد است.",["ضریب دلخواه را وارد کنید.","برای مثال، ضریب ۱٫۵ یعنی فاصلهٔ یک‌ونیم برابر ATR.","اثر فاصلهٔ استاپ روی حجم معامله را ببینید."],"این ضریب مربوط به استاپ ورود است و با MULT در Trail مستقل است.","detail"],"account_base":["مبنای حساب · Custom / Balance / Equity","این دکمه مبنایی را مشخص می‌کند که ریسک درصدی از آن محاسبه می‌شود. Balance ماندهٔ حساب، Equity ارزش جاری حساب و Custom مقدار دلخواه است.",["با کلیک بین مبناهای نمایش‌داده‌شده جابه‌جا شوید.","در این دمو مقدار حساب را می‌توانید برای آزمایش تغییر دهید.","در حالت درصدی، تغییر مبنا روی مبلغ ریسک و حجم اثر می‌گذارد."],"ریسک مبلغی و حجم ثابت مستقیماً از درصد مقدار حساب ساخته نمی‌شوند.","detail"],"risk_percent":["ریسک به درصد · %","در این حالت ورودی Risk درصدی از مبنای حساب است. پنل مبلغ مجاز ریسک را محاسبه می‌کند و سپس حجم متناسب با فاصلهٔ استاپ را به دست می‌آورد.",["دکمهٔ % را انتخاب کنید.","در Input درصد ریسک را وارد کنید.","در Result درصد نهایی پس از گردشدن حجم را بخوانید."],"مبنای حساب از ردیف Account انتخاب می‌شود.","detail"],"risk_money":["ریسک مبلغ ثابت · $","این حالت اجازه می‌دهد مبلغ ریسک را مستقیم به دلار وارد کنید. پنل حجم را طوری محاسبه می‌کند که زیان برآوردشده تا استاپ در محدودهٔ همان مبلغ باشد.",["دکمهٔ $ را انتخاب کنید.","مبلغ ریسک دلاری را در Input وارد کنید.","مبلغ و درصد نهایی را در خروجی بررسی کنید."],"با تغییر موجودی حساب، مبلغ انتخابی ثابت می‌ماند ولی نسبت آن به حساب تغییر می‌کند.","detail"],"risk_lot":["حجم ثابت · Lot","در این حالت حجم معامله را شما تعیین می‌کنید؛ پنل ریسک دلاری و درصدی را از حجم و فاصلهٔ استاپ محاسبه می‌کند.",["دکمهٔ Lot را انتخاب کنید.","حجم موردنظر را برحسب لات در Input وارد کنید.","قبل از ادامه، مبلغ ریسک نهایی را بررسی کنید."],"در حالت Lot، دورترشدن استاپ با حجم ثابت باعث افز دل در حال تشکیل در این بررسی استفاده نمی‌شود.","detail"],"trail_atr_period":["دورهٔ ATR · PERIOD","این کادر تعداد دوره‌های محاسبهٔ ATR در روش تریل ATR را تعیین می‌کند. داده از کندل بسته‌شدهٔ تایم‌فریم TF خوانده می‌شود.",["دوره را از ۱ تا ۵۰۰ وارد کنید.","MULT را جداگانه برای ضریب فاصله تنظیم کنید.","START زمان شروع استفاده از این روش را مشخص می‌کند."],"این تنظیم مربوط به Trail است و کاربردش با ATR استاپ ورود در Setup جداست.","detail"],"trail_ma_period":["دورهٔ EMA · PERIOD","در روش MA، این عدد تعداد دوره‌های میانگین متحرک نمایی قیمت Close را مشخص می‌کند. اکسپرت مقدار کندل بسته‌شده را مبنای سطح استاپ قرار می‌دهد.",["دورهٔ EMA را از ۱ تا ۵۰۰ وارد کنید.","تایم‌فریم TF را انتخاب کنید.","با BUFFER فاصلهٔ اضافه از EMA را تعیین کنید."],"روش MA این اکسپرت مشخصاً EMA روی قیمت بسته‌شدن است.","detail"],"trail_atr_mult":["ضریب ATR · MULT","MULT ضریبی است که مقدار ATR را به فاصلهٔ دنبال‌کردن استاپ تبدیل می‌کند. مثلاً ATR برابر چهار دلار و MULT برابر دو، فاصلهٔ هشت دلاری می‌سازد.",["ضریب مثبت را در این خانه وارد کنید.","دورهٔ ATR و TF را جداگانه تنظیم کنید.","START شرط آغاز دنبال‌کردن را تعیین می‌کند."],"تغییر MULT به معنی تغییر دورهٔ ATR نیست.","detail"],"trail_buffer":["فاصلهٔ اضافه · BUFFER","BUFFER فاصله‌ای برحسب پوینت بیرون سطح مرجع می‌سازد: پایین Low یا فرکتال یا EMA برای خرید، و بالای سطح متناظر برای فروش.",["مقدار غیرمنفی را به پوینت وارد کنید.","صفر یعنی فاصلهٔ اضافه‌ای به سطح مرجع اعمال نشود.","مرجع این فاصله را از روش فعال Candle، Fractal یا MA بخوانید."],"BUFFER مستقل از START است؛ یکی فاصلهٔ استاپ و دیگری آستانهٔ آغاز را تنظیم می‌کند.","detail"],"trail_fractal_confirm":["فرکتال تأییدشده · CONF.","CONF. اطلاع می‌دهد که روش Fractal از فرکتال تأییدشده استفاده می‌کند؛ فرکتالی که شرایط تأیید آن با کندل‌های بسته‌شده کامل شده است.",["این برچسب را به‌عنوان توضیح روش بخوانید.","تایم‌فریم و BUFFER را در فیلدهای قابل تنظیم تعیین کنید.","در این روش، PERIOD یا تعداد کندلِ قابل ویرایش وجود ندارد."],"CONF. دکمهٔ تغییر تنظیم نیست؛ وضعیت استفاده از فرکتال تأییدشده را توضیح می‌دهد.","detail"],"trail_sar_step":["گام SAR · STEP","STEP گام شتاب اندیکاتور Parabolic SAR است. این پارامتر در کنار MAX نحوهٔ حرکت سطح SAR را تعیین می‌کند.",["یک مقدار مثبت برای STEP وارد کنید.","مقدار باید از MAX کوچک‌تر باشد.","مثال رایج برای نمایش، STEP برابر ۰٫۰۲ و MAX برابر ۰٫۲ است."],"محدودهٔ معتبر این اکسپرت ۰ < STEP < MAX ≤ ۱ است.","detail"],"trail_sar_max":["حداکثر شتاب SAR · MAX","MAX سقف پارامتر شتاب SAR را مشخص می‌کند. این مقدار تعداد معامله، حجم یا آستانهٔ سود نیست.",["عددی بزرگ‌تر از STEP وارد کنید.","مقدار نباید از یک بیشتر شود.","TF و START را مستقل از پارامترهای اندیکاتور تنظیم کنید."],"در این نمونه پارامترها نمایش داده می‌شوند؛ اندیکاتور SAR زنده محاسبه نمی‌شود.","detail"],"be_auto_r":["آستانهٔ سر‌به‌سر خودکار · AUTO BE AT","این عدد تعیین می‌کند سر‌به‌سر خودکار پس از رسیدن معامله به چند R سود آمادهٔ اجرا باشد. R از ریسک اولیهٔ همان معامله ساخته می‌شود.",["مقدار R را در این کادر وارد کنید.","ردیف‌های موردنظر را انتخاب کنید.","با AUTO R SELECTED تنظیم را برای آن‌ها آماده کنید."],"دکمهٔ BE برای اجرای دستی سر‌به‌سر است؛ این کادر آستانهٔ حالت خودکار را تعیین می‌کند.","detail"],"partial_close_lots":["حجم خروج بخشی · CLOSE TARGET","این کادر مقدار لات قابل بستن از هر معامله را مشخص می‌کند. برای نمونه، خروج ۰٫۰۱ لات از معاملهٔ ۰٫۰۵ لاتی، ۰٫۰۴ لات باقی می‌گذارد.",["حجم خروج را به لات وارد کنید.","حجم خروج باید از حجم معامله کمتر و با گام بروکر سازگار باشد.","برای اجرای دستی از EXIT و برای حالت شرطی از AUTO EXIT استفاده کنید."],"اگر حجم قابل تقسیم نباشد، اجرای خروج بخشی برای آن ردیف ممکن نیست.","detail"],"partial_auto_r":["آستانهٔ خروج بخشی · AUTO EXIT AT","این عدد شرط سود برحسب R برای خروج خودکار همان مقدار CLOSE TARGET است. تعیین حجم خروج و تعیین زمان خروج، دو ورودی جدا هستند.",["CLOSE TARGET را برای حجم خروج تعیین کنید.","در AUTO EXIT AT آستانهٔ R را وارد کنید.","با AUTO EXIT SELECTED یا AUTO EXIT ALL قانون را آماده کنید."],"R از فاصلهٔ اولیهٔ ورود تا استاپ معامله محاسبه می‌شود.","detail"],"rf_auto_r":["آستانهٔ ریسک‌فری · AUTO RF AT","این عدد مشخص می‌کند محاسبه و خروج خودکار ریسک‌فری پس از رسیدن معامله به چند R بررسی شود. حجم لازم هنگام اجرا بر اساس سود و ریسک باقیمانده محاسبه می‌شود.",["آستانهٔ R را وارد کنید.","ردیف‌های موردنظر را انتخاب کنید.","حالت خودکار را برای همان ردیف‌ها آماده کنید."],"در ریسک‌فری، استاپ در جای خود می‌ماند؛ بخشی از سود برای پوشش ریسک باقیمانده بسته می‌شود.","detail"],"manual_exit":["خروج با حجم دلخواه · MANUAL EXIT","این گزینه تعیین مستقیم مقدار لات خروج را فعال می‌کند. بعد از انتخاب آن، CLOSE TARGET حجم خروج و AUTO EXIT AT شرط حالت خودکار را تعیین می‌کنند.",["MANUAL EXIT را انتخاب کنید.","حجم خروج را در CLOSE TARGET وارد کنید.","برای خروج فوری از EXIT و برای خروج شرطی از AUTO EXIT استفاده کنید."],"نام حالت به روش تعیین حجم اشاره دارد؛ این حالت امکان آماده‌سازی خروج خودکار هم دارد.","detail"],"position_select":["انتخاب همین ردیف","مربع ابتدای ردیف مشخص می‌کند عملیات دارای کلمهٔ SELECTED روی این معامله یا سفارش اعمال شود.",["روی مربع همین ردیف کلیک کنید.","علامت انتخاب و شمارندهٔ SELECTED تغییر می‌کند.","دکمهٔ SELECTED فقط ردیف‌های انتخاب‌شده را هدف می‌گیرد."],"دکمه‌های OPEN و ALL دامنهٔ متفاوتی دارند و به انتخاب مربع‌ها محدود نیستند.","detail"],"position_info":["اطلاعات ردیف معامله","متن ردیف، نماد، نوع معامله یا سفارش و حجم لات را نشان می‌دهد. در حالت سر‌به‌سر، سود شناورِ نمونه نیز ممکن است کنار آن دیده شود.",["نماد XAUUSD را در ابتدای ردیف بخوانید.","SELL یا BUY جهت معامله و LIMIT نوع سفارش معلق را مشخص می‌کند.","عدد بعد از نوع، حجم لات همان ردیف است."],"سفارش معلق هنوز معاملهٔ باز نیست؛ قانون خودکار آن پس از تبدیل‌شدن به معامله کاربرد پیدا می‌کند.","detail"],"position_rule":["وضعیت قانون این ردیف","OFF یعنی برای این بخش، وضعیت آماده‌سازی نمایش داده نشده است. پس از ARM، نشان روش مدیریت کنار همان ردیف ظاهر می‌شود.",["روش و پارامترهای مدیریت را انتخاب کنید.","ردیف را آماده کنید و تغییر نشان آن را ببینید.","برای توقف قوانین نمونه از STOP ALL استفاده کنید."],"نمایش حالت ARM به معنی اجراشدن شرط سود نیست؛ آماده‌شدن قانون را نشان می‌دهد.","detail"],"portfolio_counts":["تعداد ردیف‌ها و انتخاب‌ها","OPEN تعداد معاملات باز، ORDERS تعداد سفارش‌های معلق و SELECTED تعداد ردیف‌های انتخاب‌شده را نشان می‌دهد.",["تفاوت معاملهٔ باز و سفارش معلق را از متن ردیف‌ها ببینید.","مربع یکی از ردیف‌ها را انتخاب کنید.","تغییر شمارندهٔ SELECTED را بررسی کنید."],"این شمارنده‌ها حجم لات یا مبلغ ریسک نیستند.","detail"],"portfolio_risk_toggle":["بازکردن ریسک پرتفوی","این دکمه جدول ریسک معاملات باز، سفارش‌های معلق و مجموع آن‌ها را باز یا جمع می‌کند.",["روی PORTFOLIO RISK + کلیک کنید.","سه ردیف ریسک دلاری و درصدی را ببینید.","برای جمع‌کردن جدول دوباره همان دکمه را بزنید."],"باز یا بسته‌بودن جدول، معامله‌ها را تغییر نمی‌دهد.","detail"],"risk_open":["Open Risk · ریسک پرتفوی","این ردیف ریسک معاملات باز موجود را به دلار و درصد مبنای حساب نشان می‌دهد.",["مبلغ دلاری را در ستون میانی بخوانید.","نسبت آن به مبنای حساب را در ستون درصد ببینید.","برای مقایسه، ردیف‌های دیگر جدول را بررسی کنید."],"در این دمو استاپ اولیهٔ ردیف‌ها فرضی است؛ معاملات بدون استاپ نیاز به رسیدگی جداگانه دارند.","detail"],"risk_pending":["Pending Risk · ریسک پرتفوی","این ردیف ریسک سفارش‌های معلق موجود را به دلار و درصد مبنای حساب نشان می‌دهد.",["مبلغ دلاری را در ستون میانی بخوانید.","نسبت آن به مبنای حساب را در ستون درصد ببینید.","برای مقایسه، ردیف‌های دیگر جدول را بررسی کنید."],"در این دمو استاپ اولیهٔ ردیف‌ها فرضی است؛ معاملات بدون استاپ نیاز به رسیدگی جداگانه دارند.","detail"],"risk_total":["Total Risk · ریسک پرتفوی","این ردیف مجموع ریسک معاملات باز و سفارش‌های معلق را به دلار و درصد مبنای حساب نشان می‌دهد.",["مبلغ دلاری را در ستون میانی بخوانید.","نسبت آن به مبنای حساب را در ستون درصد ببینید.","برای مقایسه، ردیف‌های دیگر جدول را بررسی کنید."],"در این دمو استاپ اولیهٔ ردیف‌ها فرضی است؛ معاملات بدون استاپ نیاز به رسیدگی جداگانه دارند.","detail"],"performance_today":["عملکرد امروز · TODAY","خلاصهٔ روز جاری نمونه شامل تعداد معاملات، نتیجهٔ دلاری و نسبت آن به مبنای حساب است.",["تعداد معاملات را بعد از عنوان بخوانید.","مبلغ نتیجه را با علامت مثبت یا منفی بررسی کنید.","این اطلاعات را با حجم یا ریسک معاملهٔ بعدی اشتباه نگیرید."],"اعداد function renderTabs(){ $('#tabs').innerHTML=tabs.map(([id,label,faLabel])=>`<button id="tab-${id}" type="button" role="tab" aria-selected="${state.tab===id}" aria-controls="panel-content" tabindex="${state.tab===id?0:-1}" data-tab="${id}" aria-label="${label}، ${faLabel}">${label}</button>`).join('');}
function renderPanel(){const f={setup:setupPanel,portfolio:portfolioPanel,margin:marginPanel,swaps:swapsPanel,manage:managePanel};$('#expert').classList.toggle('setup-view',state.tab==='setup');$('#expert').dataset.tab=state.tab;$('#panel-content').innerHTML=(state.settings?settingsPanel():f[state.tab]())+(state.modal==='alert'?alertPanel():state.modal==='colors'?colorPanel():'');$('#panel-content').setAttribute('aria-labelledby','tab-'+state.tab);wireGranularHelp();fitPanel();updateChart();highlightHelp();}
function fitPanel(){const wrap=$('#panel-wrap'),expert=$('#expert'),stage=$('#stage'),requested=state.scale/100,available=stage.clientWidth-48;const factor=Math.min(requested,available/PANEL_BASE_WIDTH);expert.style.width=PANEL_BASE_WIDTH+'px';expert.style.transform='scale('+factor+')';wrap.style.width=(PANEL_BASE_WIDTH*factor)+'px';wrap.style.height=(expert.offsetHeight*factor)+'px';wrap.dataset.scale=String(state.scale);parent.postMessage({type:'tradersho-expert-size',height:expert.offsetHeight,width:460,scale:state.scale},'*');}
function goTab(id,{help=id,keepTour=false}={}){if(!keepTour)stopTour();state.tab=id;state.help=help;state.helpSelection=null;state.settings=false;state.modal='';renderTabs();renderPanel();showHelp(help,true);}
// Guide text can be shown without selecting a control (initial load and tab changes).
function selectHelpTarget(element){
 const matches=$$('[data-help]',$('#panel-content')).filter(e=>e.dataset.help===element.dataset.help);
 state.helpSelection={key:element.dataset.help,index:matches.indexOf(element)};
}
function highlightHelp(){
 $$('.selected-help',$('#expert')).forEach(e=>e.classList.remove('selected-help'));
 const selection=state.helpSelection;
 if(!selection||selection.key!==state.help)return;
 const matches=$$('[data-help]',$('#panel-content')).filter(e=>e.dataset.help===selection.key);
 matches[selection.index]?.classList.add('selected-help');
}
function availableHelp(){return [...new Set([state.tab,...$$('[data-help]',$('#panel-content')).map(e=>e.dataset.help)])].filter(k=>guideData[k]);}
function exampleHTML(type){const c=calculate(),ps=portfolioStats();const metrics=(a,av,au,b,bv,bu)=>`<div class="example-metrics"><div class="example-metric"><small>${a}</small><b>${av}<em>${au}</em></b></div><div class="example-metric"><small>${b}</small><b>${bv}<em>${bu}</em></b></div></div>`;
 let body='';
 if(type==='detail')body='<p class="example-text">'+(detailExamples[state.help]?.()||'پارامتر یا دامنهٔ همین کنترل در توضیحات زیر مشخص شده است.')+'</p>';
 else if(['risk','setup','volume','commission','account'].includes(type))body=metrics('ریسک تا استاپ',money(c.risk),'USD','حجم محاسبه‌شده',num(c.lot),'LOT')+`<p class="example-sub">حساب <bdi>${money(c.base)} USD</bdi> · استاپ <bdi>${num(c.slPoints,0)} PT</bdi> · ریسک نهایی <bdi>${num(c.riskPct)}%</bdi></p>`;
 else if(type==='stop')body=metrics('فاصله تا حد ضرر',num(c.slPoints,0),'POINTS','حجم متناسب',num(c.lot),'LOT')+`<p class="example-sub">ورود <bdi>${price(state.entry)}</bdi> ← استاپ <bdi>${price(state.sl)}</bdi></p>`;
 else if(type==='target'||type==='targets')body=metrics('نسبت هدف به استاپ',num(c.tpPoints/c.slPoints),'R','سود خالص فرضی',money(c.reward),'USD')+`<p class="example-sub">هدف اول <bdi>${price(state.tp)}</bdi>${state.additional?' · هدف دوم '+`<bdi>${price(state.entry+(state.direction==='Long'?1:-1)*Math.abs(state.entry-state.sl)*(state.extraR||3))}</bdi>`:''}</p>`;
 else if(type==='margin')body=metrics('مارجین معامله',money(c.posMargin),'USD','اهرم محاسباتی','1:'+(state.leverage||100),'')+`<p class="example-sub">مارجین آزاد پس از معامله: <bdi>${money(c.free)} USD</bdi></p>`;
 else if(type==='swap')body=metrics('خرید / یک شب عادی','−'+money(c.lot*1.26),'USD','فروش / یک شب عادی','−'+money(c.lot*.46),'USD')+`<p class="example-sub">برای حجم <bdi>${num(c.lot)} lot</bdi> · نرخ‌های کاملاً فرضی</p>`;
 else if(type==='portfolio')body=metrics('ریسک موجود',money(ps.risk),'USD','معاملات باز',String(state.positions.filter(p=>!p.closed).length),'')+`<p class="example-sub">ریسک پس از اضافه‌شدن سناریوی Setup: <bdi>${money(ps.risk+c.risk)} USD</bdi></p>`;
 else if(type==='be')body=`<p class="example-text">در نمونهٔ خرید با استاپ <bdi>10 USD</bdi>، مقدار <bdi>${num(state.autoR)}R</bdi> یعنی آماده‌سازی سر‌به‌سر پس از <bdi>${num(10*state.autoR,2)} USD</bdi> پیشروی.</p>`;
 else if(type==='partial')body=`<p class="example-text">حجم خروج انتخابی <bdi>${num(state.partialLots)} lot</bdi> است؛ آستانهٔ خودکار روی <bdi>${num(state.partialR)}R</bdi> قرار دارد.</p>`;
 else if(type==='riskfree')body=`<p class="example-text">در مثال بدون هزینه، در سود <bdi>2R</bdi>، بستن یک‌سوم حجم می‌تواند زیان دو‌سوم باقیمانده تا استاپ اولیه را پوشش دهد.</p>`;
 else if(type==='trail')body=`<p class="example-text">روش انتخابی <bdi>${state.trailMode}</bdi> است. شروع دنبال‌کردن روی <bdi>${num(state.trailStart)}R</bdi> تنظیم شده است.</p>`;
 else if(type==='performance')body=metrics('عملکرد امروز','+'+money(state.closedProfit),'USD','نتیجهٔ تجمیعی','+'+money(840+state.closedProfit),'USD');
 else if(type==='preset')body=`<p class="example-text">نمونهٔ A: ریسک <bdi>1%</bdi> و هدف <bdi>2R</bdi><br>نمونهٔ B: ریسک <bdi>0.5%</bdi> و هدف <bdi>3R</bdi></p>`;
 else if(type==='daily')body=metrics('سقف روزانه',num(state.dailyLimit),'%','بودجهٔ فرضی',money(c.base*state.dailyLimit/100),'USD');
 else if(type==='atr')body=`<p class="example-text">با ATR کندل‌های ساختگی <bdi>${num(currentAtr())}</bdi> و ضریب <bdi>${num(state.atrFactor)}</bdi>، فاصلهٔ استاپ <bdi>${num(currentAtr()*state.atrFactor,2)} USD</bdi> می‌شود.</p>`;
 else if(type==='alert')body=`<p class="example-text">هشدار نمونه: قیمت <bdi>${state.alertCondition==='Above'?'بالاتر':'پایین‌تر'}</bdi> از <bdi>${price(state.alertPrice)}</bdi><br>هشدار قیمت در نسخهٔ متاتریدر تنظیم می‌شود؛ این دکمه در پیش‌نمایش فقط راهنما را نمایش می‌دهد.</p>`;
 else{const examples={order:`حالت انتخابی: <bdi>${state.orderType}</bdi>`,lines:`خطوط چارت: ${state.lines?'نمایان':'مخفی'}`,selection:`${fa(state.selected.filter((v,i)=>v&&state.positions[i]&&!state.positions[i].closed).length)} معاملهٔ نمونه انتخاب شده است.`,arm:'با آماده‌سازی، نشان روش انتخاب‌شده کنار معامله ظاهر می‌شود.',execute:'تغییرات مدیریتی روی ردیف‌های انتخاب‌شدهٔ همین نمونه اعمال می‌شوند.',manage:'تنظیمات و ابزارها از همین پنل قابل بررسی‌اند.',scale:`اندازهٔ فعلی پنل: <bdi>${state.scale}%</bdi>`,chartTheme:`ظاهر چارت: ${state.chartTheme==='light'?'روشن':'تیره'}`,restore:'ظاهر اولیهٔ این دمو: تیره',colors:'تنظیم رنگ خطوط و ناحیه‌های حد سود و حد ضرر در نسخهٔ متاتریدر.',settings:'چهار بخش: General / Presets / Others / Themes',general:`حالت انتخابی: ${state.mode==='simple'?'Simple':'Professional'}`,beExtra:`سود اضافه: <bdi>${money(state.beExtra)} USD</bdi>`,shortcuts:'برای دیدن فهرست، Configure shortcuts را باز کنید.',others:`Magic: <bdi>${state.magic}</bdi> · انقضا: <bdi>${state.expiry} min</bdi>`,themes:'پالت انتخابی، بلافاصله روی چارت نمونه دیده می‌شود.',close:`${fa(state.positions.filter(p=>!p.closed).length)} معاملهٔ باز فرضی`,delete:`${fa(state.pending)} سفارش معلق فرضی`,closeDelete:`${fa(state.positions.filter(p=>!p.closed).length)} معاملهٔ باز و ${fa(state.pending)} سفارش معلق فرضی`};body=`<p class="example-text">${examples[state.help]||'تنظیم این بخش را از پنل سمت چپ امتحان کنید.'}</p>`;}
 return `<div class="example-label"><span>همین حالا در نمونهٔ شما</span><span>EXAMPLE / XAUUSD</span></div>${body}`;
}
function showHelp(key,force=false){
 if(!guideData[key])key=state.tab;
 if(!force&&state.help===key&&$('#guide-content').childElementCount){highlightHelp();emitGuide(key);return;}
 state.help=key;state.visited.add(key);
 const [title,desc,steps,note,type]=guideData[key];
 const section=tabs.find(t=>t[0]===state.tab);
 $('#guide-path').innerHTML=`PRO <i>/</i> <span>${section[1].toUpperCase()}</span>`;
 $('#guide-content').innerHTML=`<div class="focus-intro"><div class="guide-index"><span class="tag">${section[1]}</span><span>${tourIndex>=0?'راهنمای گام‌به‌گام':'کاربرد و روش تنظیم'}</span></div><h2>${title}</h2><p class="guide-desc">${desc}</p><div class="example" id="live-example">${exampleHTML(type)}</div><div class="how-title"><span>چطور از این گزینه استفاده کنم؟</span></div><ol class="steps">${steps.map(s=>`<li><span>${s}</span></li>`).join('')}</ol><div class="guide-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 10v7M12 6.5v1"/></svg><span>${note}</span></div></div>`;
 highlightHelp();updateGuideNav();renderQuickTopics();emitGuide(key);
}

function validPreset(d){const range=(v,min,max)=>Number.isFinite(Number(v))&&Number(v)>=min&&Number(v)<=max;if(typeof d.name!=='string'||!d.name.trim()||d.name.length>80||!['%','$','Lot'].includes(d.riskMode)||!['Keep','Live','Fixed'].includes(d.balanceMode)||!range(d.risk,.01,d.riskMode==='%'||d.riskMode==='Lot'?100:1000000)||!Number.isInteger(Number(d.count))||!range(d.count,1,5))return false;if(d.balanceMode==='Fixed'&&!range(d.balance,100,100000000))return false;if(d.atr&&(!range(d.slPoints??10000,.01,100000000)||!Number.isInteger(d.atrPeriod??14)||!range(d.atrPeriod??14,1,200)||!range(d.atrFactor??1.5,.1,10)))return false;if(d.tp&&Array.from({length:Number(d.count)},(_,i)=>d['tp'+i]??d.rr+i).some(v=>!range(v,.1,30)))return false;if(d.be&&!range(d.beR??1.5,.1,20))return false;if(d.partial&&!range(d.partialR??2,.1,20))return false;if(d.trail&&(!['Point','Candle','ATR','Fractal','MA','SAR'].includes(d.trailMode??'Point')||!range(d.trailStart??500,.01,1000000)||!range(d.trailDistance??100,.01,1000000)||!Number.isInteger(d.trailPeriod??14)||!range(d.trailPeriod??14,1,500)||!range(d.trailFactor??1.5,.1,10)||!range(d.sarStep??.02,.001,1)||!range(d.sarMax??.2,.001,1)||Number(d.sarStep??.02)>=Number(d.sarMax??.2)))return false;return true;}
function applySourcePreset(p,index){state.preset=p.name;state.presetIndex=index;state.riskMode=p.riskMode;state.risk=p.risk;if(p.balanceMode==='Fixed'){state.accountBase='Custom';state.balance=p.balance;}if(p.balanceMode==='Live')state.accountBase='Balance';if(p.atr){state.atr=false;state.atrPeriod=p.atrPeriod||14;state.atrTime=p.atrTime||'M15';state.atrFactor=p.atrFactor||1.5;state.sl=state.entry+(state.direction==='Long'?-1:1)*(p.slPoints||10000)*POINT_SIZE;}if(p.tp){state.tpLocked=true;state.tp=state.entry+(state.direction==='Long'?1:-1)*Math.abs(state.entry-state.sl)*(p.tp0||p.rr);state.targets=Array.from({length:Number(p.count)-1},(_,i)=>({r:p['tp'+(i+1)]||p.rr+i+1,lot:.01}));}if(p.be)state.autoR=p.beR||1.5;if(p.partial)state.partialR=p.partialR||2;if(p.trail){state.trailMode=p.trailMode||'Point';state.trailStart=p.trailStart||500;state.trailStartUnit=p.trailUnit||'PT';state.trailDist=p.trailDistance||100;state.trailPeriod=p.trailPeriod||14;state.trailFactor=p.trailFactor||1.5;state.sarStep=p.sarStep||.02;state.sarMax=p.sarMax||.2;}toast('پریست در سناریوی وب اعمال شد؛ ARM باید جدا انجام شود.');}

('atrFactor','Multiplier',d.atrFactor??1.5)+'</div>':key==='tp'?selectSource('count','Targets',['1','2','3','4','5'],d.count)+Array.from({length:Number(d.count)},(_,i)=>sf('tp'+i,'TP '+(i+1)+' (R)',d['tp'+i]??d.rr+i)):key==='be'?sf('beR','Trigger at (R)',d.beR??1.5):key==='partial'?sf('partialR','Trigger at (R)',d.partialR??2)+'<div class="micro-caption">Choose the close volume and activate in Portfolio.</div>':`<div class="source-trail-methods">${['Point','Candle','ATR','Fractal','MA','SAR'].map(m=>xb(m,'preset-trail-method',`data-method="${m}"`,(d.trailMode??'Point')===m?'on':'')).join('')}</div><div class="source-three-fields">${sf('trailStart','Start',d.trailStart??500)}${sf('trailDistance',(d.trailMode??'Point')==='Point'?'Distance (pt)':'Buffer (pt)',d.trailDistance??100)}${selectSource('trailTF','Timeframe',['Current','M1','M5','M15','H1','H4','D1'],d.trailTF??'M15')}</div>${selectSource('trailUnit','Start unit',['PT','R'],d.trailUnit??'PT')}${['Candle','ATR','MA'].includes(d.trailMode??'Point')?`<div class="source-three-fields">${sf('trailPeriod','Period',d.trailPeriod??14)}${d.trailMode==='ATR'?sf('trailFactor','Multiplier',d.trailFactor??1.5):''}</div>`:''}${d.trailMode==='SAR'?`<div class="source-three-fields">${sf('sarStep','Step',d.sarStep??.02)}${sf('sarMax','Maximum',d.sarMax??.2)}</div>`:''}`}</div></details>`).join('')}<div class="source-preset-footer">${xb('Use current setup','preset-capture')}${xb('Cancel','preset-cancel')}${xb('Save preset','preset-save','','on')}</div></div>`}

$('#panel-content').addEventListener('click',e=>{const el=e.target.closest('[data-action^="source-"]');if(!el)return;const a=el.dataset.action.slice(7);if(!['preset-new','preset-edit','preset-rename','preset-capture','preset-risk-mode','preset-balance-mode','preset-trail-method','preset-cancel','preset-save','preset-delete','preset-default','preset-apply','exchange','exchange-back','exchange-help','alert-add','alert-sound','alert-mobile','alert-toggle','alert-delete','alert-prev','alert-next','color-mode','color-role','color-reset','color-apply','color-cancel'].includes(a))return;e.stopImmediatePropagation();const p=sourceState.presets[sourceState.selected];if(a==='preset-new'||a==='preset-edit'||a==='preset-rename'){sourceState.draft=structuredClone(p||sourceState.presets[0]||{risk:1,riskMode:'%',balanceMode:'Keep',count:1,rr:2});sourceState.editor=a==='preset-new'?'new':'edit';if(a==='preset-new')sourceState.draft.name='My preset';}

const renderPanelUnchecked=renderPanel;let renderingNative=false;renderPanel=function(){if(renderingNative)return;renderingNative=true;try{renderPanelUnchecked()}finally{renderingNative=false}};
const examplesBeforeAudit=exampleHTML;exampleHTML=function(type){if(type==='alert'||state.help==='alert_list')return `<p class="example-text">${sourceState.alerts.length} هشدار فرضی؛ قیمت پیش‌نویس ${price(state.alertPrice)}. وضعیت هر هشدار مستقل است؛ این صفحه پایش یا اعلان واقعی ندارد.</p>`;if(type==='swaps'||type==='dailySwap'||state.tab==='swaps')return `<p class="example-text">حجم مستقل ${num(state.swapVolume)} lot · BUY −${money(state.swapVolume*1.26)} USD · SELL −${money(state.swapVolume*.46)} USD · نرخ و روز کاملاً فرضی‌اند.</p>`;return examplesBeforeAudit(type)};
sourceState.savedColors=structuredClone(sourceState.colorDraft);const auditedAction=handleAction;handleAction=function(action,el){if(action==='colors')sourceState.colorDraft=structuredClone(sourceState.savedColors);auditedAction(action,el)};
$('#tabs').addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab)goTab(tab.dataset.tab);});
$('#tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const current=tabs.findIndex(t=>t[0]===state.tab),i=e.key==='Home'?0:e.key==='End'?4:(current+(e.key==='ArrowRight'?1:4))%5;goTab(tabs[i][0]);$('#tab-'+tabs[i][0]).focus();});
$('#panel-content').addEventListener('click',e=>{const topic=e.target.closest('[data-help]');if(topic){selectHelpTarget(topic);showHelp(topic.dataset.help);}const act=e.target.closest('[data-action]');if(act){const chosen=act.dataset.help;stopTour();handleAction(act.dataset.action,act);if(chosen&&guideData[chosen])showHelp(chosen,true);}});
$('#panel-content').addEventListener('focusin',e=>{const topic=e.target.closest('[data-help]');if(topic){selectHelpTarget(topic);showHelp(topic.dataset.help);}});
$('#panel-content').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-help][tabindex]')){e.preventDefault();selectHelpTarget(e.target);showHelp(e.target.dataset.help,true);}});
const withSourceGeneral=generalPanel;
generalPanel=function(){let html=withSourceGeneral();if(state.extraSettings)return html;html=html.replace(/<div class="erow two" data-help="general"><span class="label">Wheel step, pip<\/span>.*?<\/div>/,`<div class="source-row"><span>Mouse wheel step</span><div class="source-general-wheel">${btn('−','general-wheel','data-delta="-.1"')}${field('wheel',state.wheel,{step:'.1',min:'.1',max:100,label:'گام حرکت موس'})}${btn('+','general-wheel','data-delta=".1"')}<span>pip</span></div></div>`);return html+btn('Reset General','general-reset','','wide');};
const withSourceOthers=othersPanel;othersPanel=function(){return withSourceOthers()+btn('Reset input','others-reset','','wide')};
$('#panel-content').addEventListener('input',e=>{if(e.target.matches('[data-key]'))applyInput(e.target);if(e.target.dataset.text)state[e.target.dataset.text]=e.target.value;if(e.target.dataset.shortcut!==undefined){state.hotkeys||=['Shift+T','O','Tab','H','S','P','E','M','L','K'];state.hotkeys[Number(e.target.dataset.shortcut)]=e.target.value;}});
$('#panel-content').addEventListener('change',e=>{if(e.target.matches('[data-key]')){if(applyInput(e.target)){e.target.removeAttribute('aria-invalid');}}if(e.target.dataset.position!==undefined){state.selected[Number(e.target.dataset.position)]=e.target.checked;showHelp('selection',true);}if(e.target.dataset.select==='preset'){applyPreset(e.target.value);renderPanel();showHelp('preset',true);}});
$('#quick-topics').addEventListener('click',e=>{const el=e.target.closest('[data-topic]');if(!el)return;stopTour();const k=el.dataset.topic;if(state.tab==='portfolio'&&['be','partial','trail'].includes(k)){state.portfolioMode=k;reRender(k);}else if(k==='settings'){state.settings=true;state.settingsPage='General';reRender('settings');}else if(k==='alert'){state.settings=false;state.modal='alert';reRender('alert');}else showHelp(k,true);});
$('#guide-prev').addEventListener('click',()=>{if(tourIndex>=0){tourStep(Math.max(0,tourIndex-1));return;}const keys=availableHelp();showHelp(keys[Math.max(0,keys.indexOf(state.help)-1)],true);});

function emitGuide(key){
 if(!guideEngaged)return;
 const item=guideData[key];if(!item)return;
 const selected=$('.selected-help'),fallback=$('[data-help="'+key+'"]',$('#panel-content')),el=selected||fallback;
 const r=el?.getBoundingClientRect();const example=document.createElement('div');example.innerHTML=exampleHTML(item[4]);
 parent.postMessage({type:'tradersho-expert-guide',key,tab:state.tab,title:item[0],description:item[1],steps:item[2],note:item[3],example:[...example.querySelectorAll('.example-metric')].map(n=>(n.querySelector('small')?.textContent||'')+': '+(n.querySelector('b')?.childNodes?[...n.querySelector('b').childNodes].map(t=>t.textContent).join(' '):'')).concat([...example.querySelectorAll('.example-sub,.example-text')].map(n=>n.textContent)).join('\n'),rect:r?{x:r.x,y:r.y,width:r.width,height:r.height}:null,tourIndex,tourTotal:tour.length,scenario:{entry:state.entry,sl:state.sl,tp:state.tp,lines:state.lines,direction:state.direction,lot:calculate().lot,risk:calculate().risk}},'*');
}
function emitCatalog(){parent.postMessage({type:'tradersho-expert-catalog',items:Object.entries(guideData).map(([key,v])=>({key,title:v[0],description:v[1],steps:v[2],note:v[3]}))},'*')}
addEventListener('message',e=>{
 if(e.source!==parent||!e.data||e.data.type!=='tradersho-expert-command')return;
 const d=e.data;if(['topic','tour','next','previous'].includes(d.action))guideEngaged=true;if(d.action==='reset')guideEngaged=false;if(d.action==='tour')tourStep(0);else if(d.action==='next')tourIndex>=0?tourStep(tourIndex+1):$('#guide-next').click();else if(d.action==='previous')tourIndex>=0?tourStep(Math.max(0,tourIndex-1)):$('#guide-prev').click();else if(d.action==='stop')stopTour();
 else if(d.action==='reset')$('#reset-button').click();else if(d.action==='topic'&&guideData[d.key]){stopTour();if(tabs.some(t=>t[0]===d.tab))goTab(d.tab);if(d.tab==='portfolio'){const method=/^trail_(point|candle|atr|fractal|ma|sar)/.exec(d.key);if(method){state.trailMode={point:'Point',candle:'Candle',atr:'ATR',fractal:'Fractal',ma:'MA',sar:'SAR'}[method[1]];if(state.trailMode!=='Point'){state.trailStartUnit='PT';state.trailStart=500;}}state.portfolioMode=/trail/.test(d.key)?'trail':/partial|exit|rf_|riskfree/.test(d.key)?'partial':'be';if(/riskfree|rf_/.test(d.key))state.partialMode='rf';renderPanel();}if(/^target_extra/.test(d.key)&&!state.targets.length){state.targets=[{r:3,lot:.01}];renderPanel();}if(d.key==='shortcuts_full'){state.tab='manage';state.settings=true;state.settingsPage='General';state.extraSettings=true;renderTabs();renderPanel();}if(d.key==='simple_mode'){state.mode='simple';state.settings=false;renderPanel();}if(d.key==='preset_editor'||d.key==='preset_exchange'||Object.keys(presetHelp).includes(d.key)){state.tab='manage';state.settings=true;state.settingsPage='Presets';if(d.key!=='preset_exchange'){sourceState.editor=sourceState.selected<0?'new':'edit';sourceState.draft=structuredClone(sourceState.presets[sourceState.selected]||sourceState.presets[0]);}else sourceState.exchange=true;renderTabs();renderPanel();}if(d.key==='stop_limit_native'){state.orderType='Stop Limit';state.stopPrice=state.entry+(state.direction==='Long'?5:-5);renderPanel();}if(/^alert/.test(d.key)){state.modal='alert';renderPanel();}if(d.key==='colors'||d.key==='trade_colors_full'){state.modal='colors';renderPanel();}if(['general','presetManager','others','themes','shortcuts','daily','beExtra'].includes(d.key)){state.tab='manage';state.settings=true;state.settingsPage=d.key==='presetManager'?'Presets':d.key==='others'?'Others':d.key==='themes'?'Themes':'General';state.extraSettings=d.key==='shortcuts';renderTabs();renderPanel();}const el=$('[data-help="'+d.key+'"]',$('#panel-content'));if(el){selectHelpTarget(el);el.scrollIntoView({block:'nearest'});}showHelp(d.key,true);}
 else if(d.action==='level'&&['sl','tp'].includes(d.key)&&Number.isFinite(d.value)&&d.value>=3970&&d.value<=4070){const below=d.key==='sl'?state.direction==='Long':state.direction!=='Long';if(below?d.value<state.entry:d.value>state.entry){state[d.key]=d.value;syncPriceInputs();updateNumbers();}}
 else if(d.action==='catalog')emitCatalog();
});
